name: Digest

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pages: read
    env:
      DIGEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      PYTHONHASHSEED: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev]"

      - name: Prepare required embedding model
        run: python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('sentence-transformers/all-MiniLM-L6-v2')"

      - name: Run tests
        run: python -m pytest -q

      - name: Run offline evaluation
        run: python src/evaluation/harness.py

      - name: Refresh digest
        env:
          PROCESS_ALL_WHEN_NO_NEW: "true"
          ENABLE_SUMMARY_QA: "false"
          DIGEST_REQUIRE_EMBEDDINGS: "true"
          HF_HUB_OFFLINE: "1"
          # This runner intentionally uses the supported extractive fallback.
          # No Ollama service is provisioned; do not contact a remote service.
          OLLAMA_HOST: "http://127.0.0.1:1"
        run: python src/run_pipeline.py

      - name: Validate current publication
        run: python src/digest_core/publication.py --run-id "$DIGEST_RUN_ID"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: ${{ needs.build.result == 'success' }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
